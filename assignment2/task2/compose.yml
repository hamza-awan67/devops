services:
  web:
    build: .
    ports:
      - "8000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - .:/code
    networks:
      - app-network
    command: flask --app app run --host=0.0.0.0 --port=5000

  redis:
    image: redis:alpine
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
